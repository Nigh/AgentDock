services:
  agent-server:
    build:
      context: .
      args:
        # Go module proxy for the build; set in .env if the default is
        # unreachable from your host (e.g. https://goproxy.cn,direct).
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: agentdock-server
    restart: unless-stopped
    ports:
      # set AGENTDOCK_PUBLISH in .env, e.g. "127.0.0.1:8080" behind a proxy
      - "${AGENTDOCK_PUBLISH:-8080}:8080"
    environment:
      # No credentials here: the first account registered in the web UI
      # becomes the admin; node tokens are generated per user on the
      # dashboard.
      # Set to "false" only when testing over plain http (no TLS proxy).
      AGENTDOCK_COOKIE_SECURE: ${AGENTDOCK_COOKIE_SECURE:-true}
    volumes:
      - agentdock-data:/data

volumes:
  agentdock-data:
