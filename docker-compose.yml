services:
  agent-server:
    build: .
    container_name: agentdock-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # No credentials here: the first account registered in the web UI
      # becomes the admin; node tokens are generated per user on the
      # dashboard.
      # Set to "false" only when testing over plain http (no TLS proxy).
      AGENTDOCK_COOKIE_SECURE: ${AGENTDOCK_COOKIE_SECURE:-true}
    volumes:
      - agentdock-data:/data

volumes:
  agentdock-data:
